name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Do not spend the private repository's allowance on automatic runs.
    # Public standard GitHub-hosted runners are free; manual private runs remain opt-in.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify clean checked-out revision
        run: npm run verify
      - name: Install locked Chromium and Linux prerequisites
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Install locked Chromium on Windows
        if: runner.os == 'Windows'
        run: npx --no-install playwright install chromium
      - name: Run isolated browser regression
        run: npm run test:browser
      - name: Upload verification evidence and isolated browser artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            .prism/cache/verification/latest.json
            .prism/cache/browser/latest.json
            .prism/cache/browser/*/results.json
            .prism/cache/browser/*/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
